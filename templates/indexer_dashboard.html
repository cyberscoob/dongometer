<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indexer Activity • Dongometer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { margin: 0; font-size: 2.2rem; text-shadow: 0 0 20px rgba(255, 0, 255, 0.45); }
        .subtitle { color: #aaa; margin-top: 6px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 24px; gap: 12px; flex-wrap: wrap; }
        .back-link {
            color: #ff00ff; text-decoration: none; border: 1px solid #ff00ff;
            border-radius: 999px; padding: 8px 14px; font-weight: bold;
        }
        .back-link:hover { background: #ff00ff; color: #fff; }
        .poll-status { color: #9be7ff; font-size: 0.95rem; }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .metric-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid #3a3a52;
            border-radius: 14px;
            padding: 14px;
        }
        .metric-label { color: #9aa0b5; font-size: 0.85rem; }
        .metric-value { font-size: 2rem; color: #00ff88; margin-top: 6px; font-weight: bold; }

        .section {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid #3a3a52;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .section h2 { margin: 0 0 12px; color: #ff77ff; font-size: 1.1rem; }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 14px;
        }
        @media (max-width: 980px) { .charts-grid { grid-template-columns: 1fr; } }

        .room-list { display: grid; gap: 10px; }
        .room-item {
            display: grid;
            grid-template-columns: 1.7fr 0.6fr 0.9fr;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid #2a2a3d;
            padding: 10px 0;
        }
        .room-item:last-child { border-bottom: none; }
        .room-name { color: #7df4ff; font-weight: bold; }
        .room-meta { color: #8d92a6; font-size: 0.8rem; margin-top: 3px; }
        .room-count { text-align: right; font-weight: bold; color: #fff; }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            text-align: center;
            justify-self: end;
        }
        .active { background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid rgba(0,255,136,0.45); }
        .idle { background: rgba(255, 255, 255, 0.08); color: #c5c8d3; border: 1px solid rgba(255,255,255,0.14); }
        .error { color: #ff7b7b; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Matrix Indexer Activity</h1>
            <div class="subtitle">Live room activity + ingestion throughput</div>
        </div>

        <div class="topbar">
            <a class="back-link" href="/">⬅ Dashboard</a>
            <div class="poll-status" id="poll-status">connecting…</div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card"><div class="metric-label">Total Messages</div><div class="metric-value" id="total-messages">-</div></div>
            <div class="metric-card"><div class="metric-label">Rooms Tracked</div><div class="metric-value" id="active-channels">-</div></div>
            <div class="metric-card"><div class="metric-label">Indexed Since</div><div class="metric-value" id="index-since">-</div></div>
            <div class="metric-card"><div class="metric-label">Msgs/Hour (24h avg)</div><div class="metric-value" id="msg-rate">-</div></div>
            <div class="metric-card"><div class="metric-label">Live Msgs/Min</div><div class="metric-value" id="live-rate">-</div></div>
            <div class="metric-card"><div class="metric-label">Hot Rooms (&lt;2m)</div><div class="metric-value" id="hot-rooms">-</div></div>
        </div>

        <div class="charts-grid">
            <div class="section">
                <h2>Live Ingestion Rate by Room</h2>
                <div style="margin-bottom:10px; color:#9aa0b5;">
                    Range: <select id="time-range" style="background:#1f2332;color:#fff;border:1px solid #3a3a52;border-radius:8px;padding:4px 8px;">
                        <option value="1h">1hr</option>
                        <option value="24h" selected>24hrs</option>
                        <option value="1week">1week</option>
                        <option value="1month">1month</option>
                        <option value="all">all time</option>
                    </select>
                </div>
                <canvas id="liveChart" height="140"></canvas>
            </div>
            <div class="section">
                <h2>Room Activity Split (latest)</h2>
                <canvas id="roomChart" height="140"></canvas>
            </div>
        </div>

        <div class="section">
            <h2>Room Activity (live)</h2>
            <div class="room-list" id="rooms">Loading…</div>
        </div>
    </div>

    <script>
        const channelNames = {
            '!pYoawuzxaFxYhOVtjN:cclub.cs.wmich.edu': 'The Grand Hall',
            '!RfkQkxlYocxeqmrBXI:cclub.cs.wmich.edu': 'The Laboratory',
            '!SASTdXhcIphYEpMGty:cclub.cs.wmich.edu': 'The Observatory',
            '!xrWBUUXQVKbWIuvMDi:cclub.cs.wmich.edu': 'The Workshop',
            '!CUqbYAuoIkIOvzXnCA:cclub.cs.wmich.edu': 'The Archives',
            '!EjjqonNwfCfQEvxjmG:cclub.cs.wmich.edu': 'The Commons',
            '!ngdIUcFszKkRsppRwp:cclub.cs.wmich.edu': 'The Atrium',
            '!kMHDOGXKJmQizYEDTM:cclub.cs.wmich.edu': 'The Council Room',
            '!FuKVmsdGDqELoLzabM:cclub.cs.wmich.edu': 'The Vault',
            '!dkaEtUvJgNFDmbmfPL:cclub.cs.wmich.edu': 'The Study'
        };

        const POLL_MS = 5000;
        const LIVE_POINTS = 36;
        const ROOM_COLORS = ['#00ff88','#00d9ff','#ff77ff','#ffb347','#ff6b6b','#9d84ff','#89ffde','#ffd166','#7bdff2','#caffbf'];
        let previous = null;

        const liveChart = new Chart(document.getElementById('liveChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: [],
                datasets: []
            },
            options: {
                responsive: true,
                animation: false,
                scales: {
                    x: { ticks: { color: '#94a0b8' }, grid: { color: '#2b3344' } },
                    y: { beginAtZero: true, ticks: { color: '#94a0b8' }, grid: { color: '#2b3344' } }
                },
                plugins: { legend: { labels: { color: '#fff' } } }
            }
        });

        const roomChart = new Chart(document.getElementById('roomChart').getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: [],
                datasets: [{
                    data: [],
                    backgroundColor: ['#00ff88','#00d9ff','#ff77ff','#ffb347','#ff6b6b','#9d84ff','#89ffde','#ffd166','#7bdff2','#caffbf']
                }]
            },
            options: {
                responsive: true,
                animation: false,
                plugins: {
                    legend: { labels: { color: '#fff', boxWidth: 12 } }
                }
            }
        });

        function roomAliasFromHash(roomId) {
            const adjectives = ['Amber','Neon','Velvet','Copper','Lunar','Crimson','Silent','Glitch','Solar','Frost','Jade','Obsidian','Misty','Rapid','Ivory','Nova','Rusty','Cinder','Echo','Azure'];
            const nouns = ['Atrium','Workshop','Vault','Garden','Archive','Lab','Hall','Forge','Harbor','Nexus','Studio','Library','Sanctum','Terrace','Bridge','Parlor','Den','Signal','Canopy','Beacon'];

            let h = 2166136261;
            for (let i = 0; i < roomId.length; i++) {
                h ^= roomId.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            const a = adjectives[Math.abs(h) % adjectives.length];
            const n = nouns[Math.abs((h >>> 8)) % nouns.length];
            const num = String(Math.abs((h >>> 16)) % 1000).padStart(3, '0');
            return `${a} ${n} ${num}`;
        }

        function formatRoomName(roomId) {
            return channelNames[roomId] || roomAliasFromHash(roomId);
        }

        function isHot(lastMessageIso) {
            if (!lastMessageIso) return false;
            const ms = Date.now() - new Date(lastMessageIso).getTime();
            return ms <= 2 * 60 * 1000;
        }

        async function updateSeriesChart(rangeKey) {
            try {
                const resp = await fetch(`/api/indexer-series?range=${encodeURIComponent(rangeKey)}`, { cache: 'no-store' });
                const payload = await resp.json();
                if (payload.error) throw new Error(payload.error);

                const labels = (payload.labels || []).map(ts => {
                    const d = new Date(ts);
                    if (rangeKey === '1h' || rangeKey === '24h') {
                        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }
                    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
                });

                liveChart.data.labels = labels;
                liveChart.data.datasets = (payload.series || []).slice(0, 8).map((serie, idx) => {
                    const color = ROOM_COLORS[idx % ROOM_COLORS.length];
                    return {
                        label: formatRoomName(serie.room_id),
                        data: serie.data || [],
                        borderColor: color,
                        backgroundColor: color + '22',
                        fill: false,
                        tension: 0.3,
                        borderWidth: 2,
                        pointRadius: 1
                    };
                });
                liveChart.update();
            } catch (err) {
                console.error('series chart error', err);
            }
        }

        function updateRoomChart(roomCounts) {
            const top = roomCounts.slice(0, 6);
            roomChart.data.labels = top.map(r => formatRoomName(r.room_id));
            roomChart.data.datasets[0].data = top.map(r => r.count);
            roomChart.update();
        }

        function renderRooms(roomCounts) {
            const rows = roomCounts
                .slice()
                .sort((a, b) => new Date(b.last_message || 0) - new Date(a.last_message || 0))
                .map(room => {
                    const hot = isHot(room.last_message);
                    const last = room.last_message ? new Date(room.last_message).toLocaleTimeString() : 'unknown';
                    const first = room.first_message ? new Date(room.first_message).toLocaleDateString() : 'unknown';
                    return `
                        <div class="room-item">
                            <div>
                                <div class="room-name">${formatRoomName(room.room_id)}</div>
                                <div class="room-meta">First: ${first} • Last: ${last}</div>
                            </div>
                            <div class="badge ${hot ? 'active' : 'idle'}">${hot ? 'ACTIVE' : 'idle'}</div>
                            <div class="room-count">${room.count.toLocaleString()}</div>
                        </div>
                    `;
                })
                .join('');
            document.getElementById('rooms').innerHTML = rows || '<div class="room-meta">No rooms found yet.</div>';
            document.getElementById('hot-rooms').textContent = roomCounts.filter(r => isHot(r.last_message)).length;
        }

        async function loadData() {
            const stamp = new Date();
            try {
                const response = await fetch('/api/indexer-stats', { cache: 'no-store' });
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                document.getElementById('total-messages').textContent = (data.total_messages || 0).toLocaleString();
                document.getElementById('active-channels').textContent = data.unique_rooms ?? 0;
                document.getElementById('index-since').textContent = data.first_message_date || 'Unknown';
                document.getElementById('msg-rate').textContent = Number(data.messages_per_hour || 0).toFixed(1);

                const roomCounts = data.room_counts || [];
                const deltaMin = previous ? Math.max(0.0833, (stamp - previous.at) / 60000) : 1;
                const prevMap = previous?.roomMap || {};

                const roomRates = {};
                roomCounts.forEach(r => {
                    const prevCount = prevMap[r.room_id] || 0;
                    const delta = Math.max(0, (r.count || 0) - prevCount);
                    const rate = delta / deltaMin;
                    if (rate > 0) roomRates[r.room_id] = rate;
                });

                const liveRate = Object.values(roomRates).reduce((a,b)=>a+b,0);
                const newMap = Object.fromEntries(roomCounts.map(r => [r.room_id, r.count || 0]));
                previous = { total: data.total_messages || 0, at: stamp, roomMap: newMap };

                document.getElementById('live-rate').textContent = liveRate.toFixed(1);
                renderRooms(roomCounts);
                updateRoomChart(roomCounts);
                // timeseries graph updates via /api/indexer-series (range selector)

                document.getElementById('poll-status').textContent = `live • updated ${stamp.toLocaleTimeString()}`;
            } catch (err) {
                console.error(err);
                document.getElementById('poll-status').innerHTML = `<span class="error">error: ${err.message}</span>`;
            }
        }

        const rangeSelect = document.getElementById('time-range');
        let selectedRange = rangeSelect ? rangeSelect.value : "24h";

        if (rangeSelect) {
            rangeSelect.addEventListener('change', () => {
                selectedRange = rangeSelect.value;
                updateSeriesChart(selectedRange);
            });
        }

        loadData();
        updateSeriesChart(selectedRange);
        setInterval(loadData, POLL_MS);
        setInterval(() => updateSeriesChart(selectedRange), 30000);
    </script>
</body>
</html>
